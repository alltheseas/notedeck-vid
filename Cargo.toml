[workspace]
resolver = "2"
package.version = "0.1.0"
members = [
    "crates/egui-vid",
    "crates/egui-vid-demo",
]

[workspace.dependencies]
# Core egui dependencies
eframe = { version = "0.31.1", default-features = false, features = [ "wgpu", "wayland", "x11", "android-game-activity" ] }
egui = { version = "0.31.1", features = ["serde"] }
egui-wgpu = "0.31.1"
egui-winit = { version = "0.31.1", features = ["android-game-activity", "clipboard"] }

# Video/audio dependencies
ffmpeg-next = "8.0"
rodio = { version = "0.21", default-features = false, features = ["playback", "symphonia-all"] }

# Async/threading
poll-promise = { version = "0.3.0", features = ["tokio"] }
parking_lot = "0.12"
crossbeam-channel = "0.5"

# HTTP streaming
hyper = { version = "1.7.0", features = ["full"] }
hyper-util = { version = "0.1", features = ["tokio"] }
hyper-rustls = { version = "0.27.7", features = ["webpki-roots"] }
http-body-util = "0.1.3"
rustls = "0.23.28"
webpki-roots = "1.0"
tokio = { version = "1.16", features = ["macros", "rt-multi-thread", "fs"] }

# Utilities
tracing = { version = "0.1.40", features = ["log"] }
thiserror = "2.0.7"
bytemuck = { version = "1.14", features = ["derive"] }

# Android
jni = "0.21.1"
android-activity = { git = "https://github.com/damus-io/android-activity", rev = "4ee16f1585e4a75031dc10785163d4b920f95805", features = [ "game-activity" ] }

# macOS native video decoding (VideoToolbox HW acceleration)
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSArray", "NSDictionary", "NSString", "NSURL", "NSValue", "NSError"] }
objc2-av-foundation = { version = "0.3", features = ["AVAsset", "AVAssetReader", "AVAssetReaderOutput", "AVAssetTrack", "AVMediaFormat", "objc2-core-media", "objc2-core-video", "objc2-core-foundation"] }
objc2-core-media = { version = "0.3", features = ["CMTime", "CMTimeRange", "CMSampleBuffer", "CMFormatDescription", "objc2", "objc2-core-video"] }
objc2-core-video = { version = "0.3", features = ["CVBuffer", "CVImageBuffer", "CVPixelBuffer", "CVReturn", "CVBase", "objc2"] }
objc2-video-toolbox = "0.3"
block2 = "0.6"

[profile.small]
inherits = 'release'
opt-level = 'z'
lto = true
codegen-units = 1
panic = 'abort'
strip = true

[patch.crates-io]
egui = { git = "https://github.com/damus-io/egui", rev = "e05638c40ef734312b3b3e36397d389d0a78b10b" }
eframe = { git = "https://github.com/damus-io/egui", rev = "e05638c40ef734312b3b3e36397d389d0a78b10b" }
egui-winit = { git = "https://github.com/damus-io/egui", rev = "e05638c40ef734312b3b3e36397d389d0a78b10b" }
egui-wgpu = { git = "https://github.com/damus-io/egui", rev = "e05638c40ef734312b3b3e36397d389d0a78b10b" }
